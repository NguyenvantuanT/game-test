name: harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HARNESS_REPO: https://github.com/NguyenvantuanT/rual-transpo-skills-claude.git
  # Tag cố định, không để main: commit mới lên harness không được làm đỏ CI dự án.
  HARNESS_REF: v6.1.0

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git clone --depth 1 --branch "$HARNESS_REF" "$HARNESS_REPO" .harness

      - name: Rules (chỉ dòng PR thêm/sửa — nợ cũ để harness-gardening)
        if: github.event_name == 'pull_request'
        env:
          HARNESS_DIFF: origin/${{ github.base_ref }}
        run: bash .harness/plugins/harness/engine/check.sh $(git diff --name-only --diff-filter=AMR "origin/${{ github.base_ref }}")
      - name: Docs drift
        run: bash .harness/plugins/harness/engine/docs-check.sh

      # --- pack godot ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install gdtoolkit
      - name: gdlint + gdformat
        run: |
          files=$(git ls-files '*.gd' ':!addons/**')
          if [ -n "$files" ]; then gdlint $files && gdformat --check $files; fi
